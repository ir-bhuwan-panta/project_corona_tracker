name: JS

on:
  push:
    branches: STAGE
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read
  actions: write

env:
  IR_API_URL: "https://app.stage.invisirisk.com"
  IR_APP_TOKEN: ${{ secrets.IR_API_KEY_STAGE }}

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    name: Sync fork and Run build

    steps:
      - name: Setup PSE
        uses: invisirisk/pse-action@feat/use-pse-data-collector
        with:
          api_url: ${{ env.IR_API_URL }}
          app_token: ${{ env.IR_APP_TOKEN }}
          # collect_dependencies: false
          mode: sidecar
          pse_image_tag: dev-test
          debug: true
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- NPM CACHING ADDED HERE ---
      # - name: Use Node.js
      #   uses: actions/setup-node@v4 # Upgraded to v4 for better stability
      #   with:
      #     node-version: "22.11.0"
      #     cache: 'npm' # Automatically caches ~/.npm
      #     cache-dependency-path: package-lock.json

      # --- PYPI CACHING ADDED HERE ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches pip downloads
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # - name: Install JS dependencies
      #   run: npm install

