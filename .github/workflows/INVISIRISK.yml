name: JS

on:
  push:
    branches: STAGE
  workflow_dispatch:

permissions: write-all
  
env:
  IR_API_URL: "https://app.dev.invisirisk.com"
  IR_APP_TOKEN: ${{ secrets.IR_API_KEY_DEV }}

jobs:
  sync-and-build:
    # 1. Switched from ubuntu-latest to windows-latest
    runs-on: windows-latest
    name: Sync fork and Run build

    # 2. Forces all run steps to use Git Bash (MinGW) by default
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup PSE
        uses: invisirisk/pse-action@develop
        with:
          api_url: ${{env.IR_API_URL}}
          app_token: ${{ env.IR_APP_TOKEN }}
          debug: true
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        # This bash syntax will now execute smoothly inside MinGW Git Bash on Windows
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
